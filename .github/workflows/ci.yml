name: CI

# What can and cannot be built here
#
# The console and the R-side checks run on every push. The add-in cannot:
# XLCALL.H and XLCALL.CPP come from Microsoft's Excel XLL SDK and are
# deliberately not in the repository (see BERT/.gitignore), so BERT64.xll
# cannot be built from a clean checkout. The controller is built on demand
# rather than on every push, because it has to build protobuf from source
# through vcpkg; see the controlr job.

on:
  push:
    branches: [master, console-upgrade]
  pull_request:
  workflow_dispatch:

jobs:

  console:
    name: console (typescript + styles)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Console/package-lock.json

      - name: install
        working-directory: Console
        run: npm ci

      - name: build
        working-directory: Console
        run: npm run build

      - name: the build produced something
        working-directory: Console
        shell: pwsh
        run: |
          $js = Get-ChildItem build -Recurse -Filter *.js -ErrorAction SilentlyContinue
          if (-not $js) { throw "no javascript in Console/build" }
          if (-not (Test-Path build/style.css)) { throw "no build/style.css" }
          "compiled $($js.Count) files, $([math]::Round((Get-Item build/style.css).Length / 1kb)) kB of css"

  r-checks:
    name: startup.R on R ${{ matrix.r }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # the oldest R the controller will start against, the version that
        # began warning about length-2 conditions, the one that made it an
        # error, and current
        r: ['3.6.3', '4.2.3', '4.3.3', 'release']
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}

      - name: startup.R checks
        run: Rscript tests/startup-guard.R

  controlr:
    name: controlr (native, on demand)
    # protobuf is built from source through vcpkg, which takes a while, so
    # this runs when asked for rather than on every push
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'

      - name: point BertRHome at the runner's R
        shell: pwsh
        run: |
          $home_dir = (Get-Command Rscript).Source | Split-Path | Split-Path | Split-Path
          if (-not (Test-Path "$home_dir\include\R.h")) {
            $home_dir = Rscript -e "cat(R.home())" | Out-String
            $home_dir = $home_dir.Trim()
          }
          "R.home: $home_dir"
          if (-not (Test-Path "$home_dir\include\R.h")) { throw "no R headers under $home_dir" }
          "BERT_R_HOME=$home_dir" | Out-File -FilePath $env:GITHUB_ENV -Append

      - uses: microsoft/setup-msbuild@v2

      - name: export the vcpkg binary cache location
        shell: pwsh
        run: "\"VCPKG_DEFAULT_BINARY_CACHE=$env:GITHUB_WORKSPACE\\vcpkg-cache\" | Out-File -FilePath $env:GITHUB_ENV -Append; New-Item -ItemType Directory -Force -Path \"$env:GITHUB_WORKSPACE\\vcpkg-cache\" | Out-Null"

      - name: cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: vcpkg-cache
          key: vcpkg-${{ runner.os }}-${{ hashFiles('ControlR/vcpkg.json', 'BERT/vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ runner.os }}-

      - name: build ControlR
        shell: pwsh
        run: |
          # hosted runners carry the v143 toolset; the tree targets v145
          msbuild ControlR\ControlR.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            /p:PlatformToolset=v143 `
            /p:BertRHome="$env:BERT_R_HOME" `
            /m /nologo /v:minimal

      - name: what came out
        shell: pwsh
        run: Get-ChildItem Build -Filter ControlR.exe | Select-Object Name, Length, LastWriteTime | Format-Table -AutoSize
